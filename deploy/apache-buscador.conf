# Alternativa para servidores com Apache (comum na HostGator/cPanel) em vez de nginx.
# Requer os módulos: proxy, proxy_http, proxy_wstunnel, rewrite
#   a2enmod proxy proxy_http proxy_wstunnel rewrite   (Debian/Ubuntu)
# Cole DENTRO do <VirtualHost *:443> do site.

RewriteEngine On
RewriteCond %{HTTP:Upgrade} =websocket [NC]
RewriteRule ^/buscador/(.*)$ ws://127.0.0.1:8501/buscador/$1 [P,L]

ProxyPreserveHost On
ProxyPass        /buscador/ http://127.0.0.1:8501/buscador/
ProxyPassReverse /buscador/ http://127.0.0.1:8501/buscador/
RedirectMatch 301 ^/buscador$ /buscador/
