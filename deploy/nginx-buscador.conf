# Cole este bloco DENTRO do "server { ... }" do site www.vitallisprofissionalrj.com.br
# (normalmente em /etc/nginx/sites-available/ ou /etc/nginx/conf.d/).
# O buscador fica em https://www.vitallisprofissionalrj.com.br/buscador/

location /buscador/ {
    proxy_pass http://127.0.0.1:8501/buscador/;
    proxy_http_version 1.1;
    proxy_set_header Upgrade $http_upgrade;       # o Streamlit usa WebSocket
    proxy_set_header Connection "upgrade";
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_read_timeout 86400;
    proxy_buffering off;
}
location = /buscador {
    return 301 /buscador/;
}
